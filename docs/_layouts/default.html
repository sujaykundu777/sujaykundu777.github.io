<!DOCTYPE html>
<html>
<head>
    {% include head.html %}
  
    <style>

        .dynamic-island-navbar {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.97);
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            display: flex;
            gap: 24px;
            padding: 12px 32px;
            z-index: 2000;
            border: 1.5px solid #222;
            min-width: 220px;
            max-width: 90vw;
            align-items: center;
        }

        .dynamic-island-navbar button {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dynamic-island-navbar button:hover {
            background: rgba(255,255,255,0.08);
            color: #ffd700;
            transform: scale(1.1);
        }

        .dynamic-island-navbar svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Top Drawer Styles */
        .settings-drawer {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100vw;
            background: rgba(20, 20, 20, 0.98);
            color: #fff;
            z-index: 3000;
            transition: top 0.35s cubic-bezier(.4,2,.6,1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding-top: 0;
        }

        .settings-drawer.open {
            top: 0;
            padding-top: 32px;
        }

        .drawer-content {
            max-width: 400px;
            margin: 0 auto;
            padding: 24px 16px 32px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: flex-start;
        }

        .drawer-content h3 {
            margin: 0 0 8px 0;
        }

        .drawer-content label {
            font-size: 1.1em;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .drawer-content button {
            margin-top: 16px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        .drawer-content button:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            .resumeTwoColumn-Template {
                width: 100vw;
                max-width: 100vw;
                margin: 0 auto;
                transform: scale(0.45);
                transform-origin: top center;
                overflow-x: hidden;
                margin-top: 16px;
            }
            .resumeTwoColumn-Container {
                flex-direction: column;
                margin-left: 0;
                margin-top: 0;
            }
            .resumeTwoColumn-Col1,
            .resumeTwoColumn-Col2 {
                width: 100%;
            }
            .canvas-container {
                overflow-x: hidden;
                padding: 0;
            }
        }

      
    </style>
   
</head>
<body>

    <main>
        <div>
        {{ content }}
        </div>
    </main>
 
    <!-- Top Drawer for Settings -->
    <div id="settingsDrawer" class="settings-drawer">
        <div class="drawer-content">
            <h3>Template Selection</h3>
            <select id="templateSelect" class="templateSwitcher" onchange="switchTemplate(this.value)">
                {% for template in site.data.templates.templates %}
                <option value="{{ template.name }}">{{ template.name | capitalize }}</option>
                {% endfor %}
            </select>
            <button onclick="closeDrawer()">Close</button>
        </div>
    </div>

    <!-- Dynamic Island Navbar -->
    <div class="dynamic-island-navbar">
        <button title="Zoom In" onclick="zoomIn()">
            <!-- Zoom In Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor"><circle cx="14" cy="14" r="10" stroke-width="2"/><line x1="14" y1="10" x2="14" y2="18" stroke-width="2"/><line x1="10" y1="14" x2="18" y2="14" stroke-width="2"/></svg>
        </button>
        <button title="Zoom Out" onclick="zoomOut()">
            <!-- Zoom Out Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor"><circle cx="14" cy="14" r="10" stroke-width="2"/><line x1="10" y1="14" x2="18" y2="14" stroke-width="2"/></svg>
        </button>
        <button title="Reset" onclick="resetResume()">
            <!-- New Reset Icon (Circular Arrow) -->
           <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" fill="none" 
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" 
            class="feather feather-rotate-ccw">
                <polyline points="1 4 1 10 7 10"/>
                <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/>
         </svg>

        </button>
        <button title="Download" onclick="downloadPDF()">
            <!-- Download Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v10"/><path d="M8 13l4 4 4-4"/><path d="M5 21h14"/></svg>
        </button>
        <button title="Settings" onclick="openDrawer()">
            <!-- New Settings Icon (Minimal Gear) -->
          <svg width="28" height="28" xmlns="http://www.w3.org/2000/svg"  fill="none" stroke="currentColor" stroke-width="2" 
     stroke-linecap="round" stroke-linejoin="round" class="feather feather-settings">
  <circle cx="12" cy="12" r="3"/>
  <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 
           1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 
           1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 
           1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 
           1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 
           1.65 0 0 0 1.82.33H9a1.65 
           1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 
           1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 
           1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09
           a1.65 1.65 0 0 0-1.51 1z"/>
</svg>

        </button>
    </div>

      <script>
    function openDrawer() {
        document.getElementById('settingsDrawer').classList.add('open');
    }
    function closeDrawer() {
        document.getElementById('settingsDrawer').classList.remove('open');
    }
    </script>
    

</body>
</html>
