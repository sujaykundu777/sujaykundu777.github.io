<!DOCTYPE html>
<html>
<head>
    {% include head.html %}
    <style>

        .canvas-container {
            padding-bottom: 90px;
        }

        .dynamic-island-navbar {
            position: fixed;
            left: 50%;
            bottom: 32px;
            transform: translateX(-50%);
            background: rgba(10, 10, 10, 0.97);
            border-radius: 32px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            display: flex;
            gap: 24px;
            padding: 12px 32px;
            z-index: 2000;
            border: 1.5px solid #222;
            min-width: 220px;
            max-width: 90vw;
            align-items: center;
        }

        .dynamic-island-navbar button {
            background: none;
            border: none;
            outline: none;
            color: #fff;
            padding: 8px;
            border-radius: 50%;
            cursor: pointer;
            transition: background 0.2s, color 0.2s, transform 0.1s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dynamic-island-navbar button:hover {
            background: rgba(255,255,255,0.08);
            color: #ffd700;
            transform: scale(1.1);
        }

        .dynamic-island-navbar svg {
            width: 28px;
            height: 28px;
            stroke: currentColor;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Top Drawer Styles */
        .settings-drawer {
            position: fixed;
            top: -100%;
            left: 0;
            width: 100vw;
            background: rgba(20, 20, 20, 0.98);
            color: #fff;
            z-index: 3000;
            transition: top 0.35s cubic-bezier(.4,2,.6,1);
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            padding-top: 0;
        }

        .settings-drawer.open {
            top: 0;
            padding-top: 32px;
        }

        .drawer-content {
            max-width: 400px;
            margin: 0 auto;
            padding: 24px 16px 32px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: flex-start;
        }

        .drawer-content h3 {
            margin: 0 0 8px 0;
        }

        .drawer-content label {
            font-size: 1.1em;
            margin-bottom: 8px;
            cursor: pointer;
        }

        .drawer-content button {
            margin-top: 16px;
            background: #222;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 8px 18px;
            cursor: pointer;
            font-size: 1em;
            transition: background 0.2s;
        }

        .drawer-content button:hover {
            background: #444;
        }

        @media (max-width: 600px) {
            .resumeTwoColumn-Template {
                width: 100vw;
                max-width: 100vw;
                margin: 0 auto;
                transform: scale(0.45);
                transform-origin: top center;
                overflow-x: hidden;
                margin-top: 16px;
            }
            .resumeTwoColumn-Container {
                flex-direction: column;
                margin-left: 0;
                margin-top: 0;
            }
            .resumeTwoColumn-Col1,
            .resumeTwoColumn-Col2 {
                width: 100%;
            }
            .canvas-container {
                overflow-x: hidden;
                padding: 0;
            }
        }

    </style>
</head>
<body>

    <main>
        {{ content }}
    </main>
 
    <!-- Top Drawer for Settings -->
    <div id="settingsDrawer" class="settings-drawer">
        <div class="drawer-content">
            <h3>Template Selection</h3>
            <select id="templateSelect" class="templateSwitcher" onchange="switchTemplate(this.value)">
                {% for template in site.data.templates.templates %}
                <option value="{{ template.name }}">{{ template.name | capitalize }}</option>
                {% endfor %}
            </select>
            <button onclick="closeDrawer()">Close</button>
        </div>
    </div>

    <!-- Dynamic Island Navbar -->
    <div class="dynamic-island-navbar">
        <button title="Zoom In" onclick="zoomIn()">
            <!-- Zoom In Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor"><circle cx="14" cy="14" r="10" stroke-width="2"/><line x1="14" y1="10" x2="14" y2="18" stroke-width="2"/><line x1="10" y1="14" x2="18" y2="14" stroke-width="2"/></svg>
        </button>
        <button title="Zoom Out" onclick="zoomOut()">
            <!-- Zoom Out Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor"><circle cx="14" cy="14" r="10" stroke-width="2"/><line x1="10" y1="14" x2="18" y2="14" stroke-width="2"/></svg>
        </button>
        <button title="Download" onclick="downloadPDF()">
            <!-- Download Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor"><path d="M14 5v14" stroke-width="2"/><path d="M7 14l7 7 7-7" stroke-width="2"/><rect x="5" y="21" width="14" height="2" rx="1" stroke-width="0" fill="currentColor"/></svg>
        </button>
        <button title="Settings" onclick="openDrawer()">
            <!-- Settings Icon -->
            <svg width="28" height="28" fill="none" stroke="currentColor"><circle cx="14" cy="14" r="3" stroke-width="2"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 15 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 8.6 15a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 13 8.6a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 13z" stroke-width="2"/></svg>
        </button>
    </div>

    <script>
    function openDrawer() {
        document.getElementById('settingsDrawer').classList.add('open');
    }
    function closeDrawer() {
        document.getElementById('settingsDrawer').classList.remove('open');
    }

    // Optional: Theme selection logic
    document.querySelectorAll('input[name="theme"]').forEach(radio => {
        radio.addEventListener('change', function() {
            if (this.value === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
            } else if (this.value === 'light') {
                document.documentElement.setAttribute('data-theme', 'light');
            } else {
                document.documentElement.removeAttribute('data-theme');
            }
        });
    });
    </script>
</body>
</html>
